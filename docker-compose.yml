version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: invoiceai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceai
      POSTGRES_PASSWORD: invoiceai_pass
      POSTGRES_DB: invoiceai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: invoiceai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: invoiceai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://invoiceai:invoiceai_pass@db:5432/invoiceai
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # frontend service will be added here in the next build step (Next.js app)

volumes:
  postgres_data:
